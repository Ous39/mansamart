limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=public_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=phone_otp:10m rate=6r/m;

server {
    listen 80;
    server_name mansamart.gm www.mansamart.gm;
    root /var/www/mansamart/web;
    index index.html;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.mansamart.gm; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(js|css|png|jpg|jpeg|svg|webp|woff2)$ { expires 7d; add_header Cache-Control "public, immutable"; }
}

server {
    listen 80;
    server_name admin.mansamart.gm;
    root /var/www/mansamart/admin;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.mansamart.gm; img-src 'self' data: https://*.google.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    server_name api.mansamart.gm;
    client_max_body_size 8m;
    location ~ ^/api/admin/auth/(login|mfa/verify)$ {
        limit_req zone=admin_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:5000;
        include proxy_params;
        add_header Cache-Control "no-store" always;
    }
    location ~ ^/api/auth/phone/(request|verify)$ {
        limit_req zone=phone_otp burst=3 nodelay;
        proxy_pass http://127.0.0.1:5000;
        include proxy_params;
        add_header Cache-Control "no-store" always;
    }
    location ~ ^/api/auth/(login|register|social|forgot-password|reset-password)$ {
        limit_req zone=public_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:5000;
        include proxy_params;
        add_header Cache-Control "no-store" always;
    }
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://127.0.0.1:5000;
        include proxy_params;
    }

    location ~ ^/api/(auth|payments|admin/payments)/ {
        proxy_pass http://127.0.0.1:5000;
        include proxy_params;
        add_header Cache-Control "no-store" always;
    }
}
