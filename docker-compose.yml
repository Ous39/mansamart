name: mansamart

services:
  postgres:
    image: postgres:16-alpine
    container_name: mansamart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mansamart
      POSTGRES_USER: mansamart
      POSTGRES_PASSWORD: mansamart
    ports:
      - "5432:5432"
    volumes:
      - mansamart_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mansamart -d mansamart"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mansamart-api
    restart: unless-stopped
    command: ["sh", "./docker/api-start.sh"]
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 5000
      DATABASE_URL: postgres://mansamart:mansamart@postgres:5432/mansamart
      SESSION_SECRET: mansamart-local-dev-secret-change-before-production
      EXPO_PUBLIC_API_URL: http://${LAN_IP:-localhost}:5000
      EXPO_PUBLIC_DOMAIN: http://${LAN_IP:-localhost}:5000
      CORS_ORIGIN: http://localhost:8081,http://127.0.0.1:8081,http://${LAN_IP:-localhost}:8081
      SEED_ON_START: "true"
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - mansamart_node_modules:/app/node_modules
      - mansamart_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  expo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mansamart-expo
    restart: unless-stopped
    command: ["sh", "./docker/expo-start.sh"]
    environment:
      NODE_ENV: development
      EXPO_PUBLIC_API_URL: http://${LAN_IP:-localhost}:5000
      EXPO_PUBLIC_DOMAIN: http://${LAN_IP:-localhost}:5000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      EXPO_TUNNEL: ${EXPO_TUNNEL:-false}
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - .:/app
      - mansamart_node_modules:/app/node_modules
    depends_on:
      - api
    stdin_open: true
    tty: true

volumes:
  mansamart_postgres_data:
  mansamart_node_modules:
  mansamart_uploads:
